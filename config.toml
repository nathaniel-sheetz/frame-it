[tv]
host = "192.168.1.3"
port = 8002
# Name shown on the TV's "Allow" prompt and in its device list.
name = "FrameArt"
timeout = 30

[server]
# 0.0.0.0 makes the app reachable from other devices on your network.
host = "0.0.0.0"
# 8080 and 8081 are taken on the Mac Mini.
port = 8090

[library]
# Where kept pictures and their crop settings live. A relative path starts at
# this folder; "~" is your home folder.
path = "data/library"

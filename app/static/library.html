<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · Frame TV Art</title>
<link rel="stylesheet" href="/static/site.css">
<style>
  #bar { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  #filters { display: flex; flex-wrap: wrap; gap: 8px; }
  #filters button.chosen { border-color: var(--accent); color: var(--accent); }
  #filters .n, #refine-toggle .n { color: var(--muted); margin-left: 4px; }
  #refine-toggle.chosen { border-color: var(--accent); color: var(--accent); }
  #refine {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 32px; margin-bottom: 16px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  #refine[hidden] { display: none; }
  #refine fieldset { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; border: 0; }
  #refine legend { width: 100%; padding: 0 0 2px; font-size: 12px; color: var(--muted); }
  #refine label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #refine input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  #refine .link { align-self: flex-end; color: var(--muted); font-size: 13px; }
  #find { flex: 1; min-width: 220px; max-width: 420px; }
  #choosing {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
  }
  #choosing[hidden] { display: none; }
  #to {
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  .card.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .choosing .thumb a { cursor: copy; }

  /* 16px, so a phone does not zoom the page in when a box is tapped. */
  input[type=text], input[type=search] {
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  }
  input[type=text]:focus, input[type=search]:focus { outline: none; border-color: var(--muted); }

  .thumb a { display: block; height: 100%; }
  .labels { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; }
  .label {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
  }
  .label.on-tv { background: var(--accent); border-color: var(--accent); color: #1a1405; }
  .label.ready { background: var(--ok); border-color: var(--ok); color: #0c1f13; }
  .label.block { background: #5b8fd9; border-color: #5b8fd9; color: #08111f; }

  .name { padding: 8px 12px 0; overflow-wrap: anywhere; }
  .meta { padding-top: 2px; }
  .actions a.nav-link { text-align: center; }
  .more { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 12px 12px; }
  .more button {
    border: 0; padding: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline;
  }
  .more button:hover:not(:disabled) { color: var(--text); }
  .more button.danger:hover:not(:disabled) { color: var(--danger); }

  dialog {
    width: min(900px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; overflow: auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .75); }
  #viewer-img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
  #viewer form { display: grid; gap: 12px; padding: 16px; }
  #viewer p { margin: 0; font-size: 13px; }
  #viewer-msg { color: var(--danger); }
  #viewer-msg:empty { display: none; }
  .field { display: grid; gap: 4px; }
  .field > span:first-child { font-size: 12px; color: var(--muted); }
  .named { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .named input { flex: 1; min-width: 0; }
  .buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .link { border: 0; padding: 0; background: none; color: var(--text); text-decoration: underline; font-size: inherit; }

  .chips {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px; cursor: text;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .chips:focus-within { border-color: var(--muted); }
  /* The chips sit in the same wrapping row as the box for typing the next one. */
  .chips > span { display: contents; }
  .chips input[type=text] { flex: 1; min-width: 140px; border: 0; padding: 2px 5px; background: none; }
  .chip {
    display: inline-flex; align-items: center; padding: 1px 2px 1px 10px; font-size: 13px; cursor: default;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; overflow-wrap: anywhere;
  }
  .chip button { border: 0; background: none; padding: 0 7px; color: var(--muted); font-size: 17px; line-height: 1.2; }
  .chip button:hover:not(:disabled) { color: var(--danger); }
  /* Comes from the picture this one was made from, and is changed there. */
  .chip.fixed { padding-right: 10px; color: var(--muted); border-style: dashed; }
</style>
</head>
<body>
<header>
  <h1>Library</h1>
  <span id="count" class="pill" hidden></span>
  <span id="state" class="pill err" hidden>TV unreachable: "On TV" may be out of date</span>
  <span class="spacer"></span>
  <a class="nav-link" href="/">Gallery</a>
  <a class="nav-link" href="/playlists">Playlists</a>
  <a class="nav-link" href="/editor">Editor</a>
</header>
<main>
  <div id="drop">
    <button id="pick" class="primary">Add pictures</button>
    <span class="hint">or drop pictures or links here (JPEG, PNG, WEBP or BMP, up to 50 MB each)</span>
    <form id="link-form">
      <input type="url" id="link" placeholder="Paste a picture link" aria-label="Picture link" required>
      <button>Add</button>
    </form>
    <input type="file" id="files" accept="image/jpeg,image/png,image/webp,image/bmp" multiple hidden>
  </div>
  <div id="bar">
    <div id="filters"></div>
    <button id="refine-toggle" aria-controls="refine" aria-expanded="false">Filters</button>
    <input type="search" id="find" placeholder="Find by name, creator or subject" aria-label="Find pictures">
    <button id="choose">Select</button>
  </div>
  <div id="refine" hidden>
    <fieldset id="refine-status"><legend>Status</legend></fieldset>
    <fieldset id="refine-only"><legend>Only pictures with</legend></fieldset>
    <button type="button" id="refine-clear" class="link">Clear</button>
  </div>
  <div id="choosing" hidden>
    <span id="chosen-count"></span>
    <select id="to" aria-label="Playlist"></select>
    <button id="add-chosen" class="primary">Add to playlist</button>
    <button id="edit-chosen">Edit one by one</button>
    <span class="hint">Tap pictures to select them.</span>
    <span class="spacer"></span>
    <button id="choose-done">Done</button>
  </div>
  <div id="msg"></div>
  <div id="grid"></div>
</main>
<dialog id="viewer">
  <img id="viewer-img" alt="">
  <form id="viewer-form">
    <label class="field">
      <span>Name</span>
      <span class="named"><input type="text" id="viewer-name" maxlength="190" required autocomplete="off"><span id="viewer-ext"></span></span>
    </label>
    <div class="field"><span>Creators</span><div class="chips" id="viewer-creators"></div></div>
    <div class="field"><span>Subjects</span><div class="chips" id="viewer-subjects"></div></div>
    <p id="viewer-from" class="hint" hidden></p>
    <p id="viewer-meta" class="hint"></p>
    <p id="viewer-msg"></p>
    <div class="buttons">
      <a id="viewer-full" class="nav-link" target="_blank">Open the full picture</a>
      <span class="spacer"></span>
      <button type="button" id="viewer-close">Close</button>
      <button class="primary">Save</button>
    </div>
  </form>
  <datalist id="known-creators"></datalist>
  <datalist id="known-subjects"></datalist>
</dialog>
<script src="/static/playing.js"></script>
<script>
const $ = id => document.getElementById(id);
const grid = $('grid'), msg = $('msg');

const viewer = $('viewer'), find = $('find');

// A picture's creators or subjects: its own, then those of what it was made from.
const described = (picture, field) => [...picture[field], ...picture.from_originals[field]];
const undescribed = (picture, field) => !described(picture, field).length;

// The views picked most often, one at a time.
const VIEWS = [
  { key: 'all', text: 'All', has: () => true },
  { key: 'showing', text: 'On TV + ready', has: p => p.status === 'on-tv' || p.status === 'ready' },
  { key: 'unused-blocks', text: 'Blocks to use', has: p => p.building_block && !p.worked_into,
    title: 'Building blocks not yet made into anything on the TV or ready' },
  { key: 'missing-details', text: 'Missing details',
    has: p => !p.used_in && (undescribed(p, 'creators') || undescribed(p, 'subjects')),
    title: 'Pictures nothing has been made from that have no creator or no subject' },
];
// The Filters menu, used instead of a view: a picture with any ticked status, and every ticked "only".
const STATUSES = [
  { key: 'on-tv', text: 'On TV', has: p => p.status === 'on-tv' },
  { key: 'ready', text: 'Ready', has: p => p.status === 'ready' },
  { key: 'blocks', text: 'Building blocks', has: p => p.building_block },
];
const ONLY = [
  { key: 'no-creator', text: 'No creator', has: p => undescribed(p, 'creators') },
  { key: 'no-subject', text: 'No subject', has: p => undescribed(p, 'subjects') },
  { key: 'no-children', text: 'No children', has: p => !p.used_in, title: 'Nothing has been made from it yet' },
];
const LABELS = { 'on-tv': 'On TV', ready: 'Ready', block: 'Building block', original: 'Original' };

let busy = false;
let data = { items: [], count: 0 };
// Picking pictures for a playlist: a tap selects a card instead of opening it.
let choosing = false;
const chosen = new Set();
// Kept in the address, so a reload or a bookmark comes back to the same filters.
let shown = readHash();

// Either a view is chosen, or the Filters menu has something ticked and `view` is null.
function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  // Older addresses were just the status: #on-tv, #ready or #blocks.
  const statuses = new Set(STATUSES.filter(s => params.has(s.key) || params.getAll('status').includes(s.key)));
  const only = new Set(ONLY.filter(o => params.getAll('only').includes(o.key)));
  const view = statuses.size || only.size ? null : VIEWS.find(v => v.key === params.get('view')) || VIEWS[0];
  return { view, statuses, only };
}

function setFilters(view, statuses = new Set(), only = new Set()) {
  // Unticking the last box in the menu goes back to All.
  shown = { view: statuses.size || only.size ? null : view || VIEWS[0], statuses, only };
  const params = new URLSearchParams();
  if (shown.view && shown.view !== VIEWS[0]) params.set('view', shown.view.key);
  for (const s of STATUSES) if (statuses.has(s)) params.append('status', s.key);
  for (const o of ONLY) if (only.has(o)) params.append('only', o.key);
  const hash = params.toString();
  history.replaceState(null, '', hash ? `#${hash}` : location.pathname + location.search);
  render();
}

const refined = picture => (!shown.statuses.size || [...shown.statuses].some(s => s.has(picture)))
  && [...shown.only].every(o => o.has(picture));

function say(text, isError = false) {
  msg.textContent = text;
  msg.className = isError ? 'err' : '';
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === 'string' ? body.detail : `Request failed (${res.status})`);
  return body;
}

function setBusy(value) {
  busy = value;
  document.querySelectorAll('button:not(#viewer-close)').forEach(b => b.disabled = value);
}

function size(bytes) {
  const units = ['bytes', 'KB', 'MB', 'GB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${i ? bytes.toFixed(bytes < 10 ? 1 : 0) : bytes} ${units[i]}`;
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// The part of a name that renaming leaves alone. The server uses the same rule.
const extension = name => (name.match(/\.(jpe?g|png|webp|bmp)$/i) || [''])[0];

function matches(picture) {
  const text = [picture.name, ...described(picture, 'creators'), ...described(picture, 'subjects')].join('\n').toLowerCase();
  return find.value.toLowerCase().split(/\s+/).every(word => text.includes(word));
}

async function load() {
  data = await api('/api/library');
  $('count').textContent = `${plural(data.count, 'picture')} · ${size(data.bytes)}`;
  $('count').hidden = false;
  // Offered while typing, so the same creator or subject is spelt the same way each time.
  for (const field of ['creators', 'subjects']) {
    const known = [...new Set(data.items.flatMap(p => p[field]))].sort((a, b) => a.localeCompare(b));
    $(`known-${field}`).replaceChildren(...known.map(value => new Option(value)));
  }
  render();
}

function button(text, onclick, className = '') {
  const b = document.createElement('button');
  b.textContent = text;
  b.className = className;
  b.disabled = busy;
  b.onclick = onclick;
  return b;
}

function editLink(picture) {
  const a = document.createElement('a');
  a.className = 'nav-link';
  a.textContent = 'Edit';
  a.href = `/editor?ids=${picture.id}`;
  return a;
}

function count(n) {
  const span = document.createElement('span');
  span.className = 'n';
  span.textContent = n;
  return span;
}

function label(text, className) {
  const span = document.createElement('span');
  span.className = `label ${className}`;
  span.textContent = text;
  return span;
}

function render() {
  // The numbers on the views count what the search box leaves.
  const found = data.items.filter(matches);
  $('filters').replaceChildren(...VIEWS.map(v => {
    const b = button(v.text, () => setFilters(v), v === shown.view ? 'chosen' : '');
    if (v.title) b.title = v.title;
    b.append(count(found.filter(v.has).length));
    return b;
  }));
  const active = shown.statuses.size + shown.only.size;
  const toggle = $('refine-toggle');
  toggle.replaceChildren('Filters', ...(active ? [count(active)] : []));
  toggle.classList.toggle('chosen', active > 0);
  for (const [list, ticked] of [[STATUSES, shown.statuses], [ONLY, shown.only]]) {
    for (const item of list) item.input.checked = ticked.has(item);
  }

  const pictures = found.filter(shown.view ? shown.view.has : refined);
  grid.replaceChildren();
  grid.classList.toggle('choosing', choosing);
  $('chosen-count').textContent = `${chosen.size} selected`;
  if (!pictures.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = !data.count
      ? 'Nothing in the library yet. Every picture you add here, in the gallery or in the editor is kept.'
      : !find.value.trim() ? 'No pictures under these filters.'
      : shown.view === VIEWS[0] ? 'No pictures match that.' : 'No pictures match that under these filters.';
    grid.append(empty);
    return;
  }
  for (const picture of pictures) grid.append(card(picture));
}

function card(picture) {
  const el = document.createElement('div');
  el.className = 'card' + (chosen.has(picture.id) ? ' chosen' : '');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  // Still a link to the file, for a long press or a middle click. A plain tap opens the popup.
  const full = document.createElement('a');
  full.href = `/api/library/${picture.id}/file`;
  full.target = '_blank';
  full.title = choosing ? 'Select' : 'Look at the picture and its details';
  full.onclick = e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    if (choosing) choose(picture);
    else view(picture);
  };
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.alt = picture.name;
  img.src = `/api/library/${picture.id}/thumb`;
  full.append(img);
  const labels = document.createElement('div');
  labels.className = 'labels';
  labels.append(label(LABELS[picture.status], picture.status));
  // On the TV and tagged: the first label says where it is, this one that it is a block too.
  if (picture.building_block && picture.status !== 'block') labels.append(label(LABELS.block, 'block'));
  thumb.append(full, labels);

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = picture.name;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `${picture.width}×${picture.height} · ${size(picture.bytes)}`
    + (picture.used_in ? ` · used in ${plural(picture.used_in, 'picture')}` : '');

  const about = document.createElement('div');
  about.className = 'meta';
  about.textContent = ['creators', 'subjects'].map(field => described(picture, field).join(', ')).filter(Boolean).join(' · ');

  const actions = document.createElement('div');
  actions.className = 'actions';
  if (picture.status === 'on-tv') {
    actions.append(button('Display', () => display(picture)), button('Remove from TV', () => removeFromTV(picture)));
  } else if (picture.status === 'ready') {
    actions.append(button('Send to TV', () => send(picture), 'primary'));
  }
  // A result opens with the originals and crops it was made from.
  actions.append(editLink(picture));

  const more = document.createElement('div');
  more.className = 'more';
  more.append(picture.building_block
    ? button('Remove building block tag', () => setTag(picture, false))
    : button('Mark as building block', () => setTag(picture, true)));
  if (picture.status !== 'on-tv') more.append(button('Delete', () => remove(picture), 'danger'));

  el.append(thumb, name, ...(about.textContent ? [about] : []), meta, actions, more);
  return el;
}

// A row of chips with a box for typing the next one.
function chips(el, known, placeholder) {
  let own = [], fixed = [];
  const row = document.createElement('span');
  const input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 100;
  input.autocomplete = 'off';
  input.placeholder = placeholder;
  input.setAttribute('list', known);
  el.append(row, input);

  function chip(value, onremove) {
    const span = document.createElement('span');
    span.className = onremove ? 'chip' : 'chip fixed';
    span.textContent = value;
    if (onremove) {
      const x = button('×', onremove);
      x.type = 'button';
      x.setAttribute('aria-label', `Remove ${value}`);
      // Keeps the typing box from losing focus, which would redraw the chips under the press.
      x.onmousedown = e => e.preventDefault();
      span.append(x);
    } else {
      span.title = 'From the picture this was made from';
    }
    return span;
  }

  function draw() {
    row.replaceChildren(
      ...fixed.filter(value => !has(value)).map(value => chip(value)),
      ...own.map((value, i) => chip(value, () => { own.splice(i, 1); draw(); input.focus(); })));
  }

  const has = value => own.some(v => v.toLowerCase() === value.toLowerCase());

  // Turn what is in the box into chips. A comma separates one from the next.
  function take() {
    for (const part of input.value.split(',')) {
      const value = part.trim().replace(/\s+/g, ' ');
      if (value && !has(value)) own.push(value);
    }
    input.value = '';
    draw();
  }

  input.oninput = () => { if (input.value.includes(',')) take(); };
  input.onchange = take;
  input.onkeydown = e => {
    if (e.key === 'Enter' && input.value.trim()) {
      // Enter in an empty box saves, like Enter in the name box.
      e.preventDefault();
      take();
    } else if (e.key === 'Backspace' && !input.value && own.length) {
      own.pop();
      draw();
    }
  };
  el.onclick = e => { if (e.target === el) input.focus(); };

  return {
    set(values, inherited) { own = [...values]; fixed = inherited; input.value = ''; draw(); },
    read() { take(); return own; },
  };
}

const fields = {
  creators: chips($('viewer-creators'), 'known-creators', 'Add a creator'),
  subjects: chips($('viewer-subjects'), 'known-subjects', 'Add a subject'),
};
let viewing = null;

function view(picture) {
  viewing = picture;
  const img = $('viewer-img');
  img.alt = picture.name;
  img.style.aspectRatio = `${picture.width} / ${picture.height}`;
  // The small preview is already loaded, so it shows at once and is swapped for a sharper one.
  img.src = `/api/library/${picture.id}/thumb`;
  const sharp = new Image();
  sharp.onload = () => { if (viewing === picture) img.src = sharp.src; };
  sharp.src = `/api/library/${picture.id}/view`;

  const ext = extension(picture.name);
  $('viewer-name').value = picture.name.slice(0, picture.name.length - ext.length);
  $('viewer-ext').textContent = ext;
  for (const field in fields) fields[field].set(picture[field], picture.from_originals[field]);
  $('viewer-meta').textContent = `${picture.width}×${picture.height} · ${size(picture.bytes)}`
    + ` · added ${new Date(picture.added_at).toLocaleDateString()}`;
  $('viewer-full').href = `/api/library/${picture.id}/file`;
  $('viewer-msg').textContent = '';
  madeFrom(picture);
  if (!viewer.open) viewer.showModal();
}

// Name the pictures this one was made from, since that is where their details are changed.
async function madeFrom(picture) {
  const line = $('viewer-from');
  line.hidden = true;
  if (picture.kind !== 'result') return;
  const { parents } = await api(`/api/library/${picture.id}`).catch(() => ({ parents: [] }));
  const kept = parents.map(parent => data.items.find(p => p.id === parent.id)).filter(Boolean);
  if (viewing !== picture || !kept.length) return;
  line.replaceChildren('Made from ');
  kept.forEach((parent, i) => {
    const link = button(parent.name, () => view(parent), 'link');
    link.type = 'button';
    line.append(i ? ' and ' : '', link);
  });
  line.append('. Details with a dashed outline come from there.');
  line.hidden = false;
}

$('viewer-form').onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  const picture = viewing;
  const body = {
    name: $('viewer-name').value + $('viewer-ext').textContent,
    creators: fields.creators.read(),
    subjects: fields.subjects.read(),
  };
  setBusy(true);
  $('viewer-msg').textContent = '';
  try {
    await api(`/api/library/${picture.id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    viewer.close();
    say('Saved.');
  } catch (err) {
    $('viewer-msg').textContent = err.message;
  }
  busy = false;
  await load().catch(err => say(err.message, true));
  setBusy(false);
};

$('viewer-close').onclick = () => viewer.close();
// A tap on the dimmed page around the popup closes it. A drag that only ends there does not.
let pressed = null;
viewer.onpointerdown = e => { pressed = e.target; };
viewer.onclick = e => { if (e.target === viewer && pressed === viewer) viewer.close(); };
find.oninput = render;

// The Filters menu is made once, so ticking a box keeps the focus on it.
function option(item, field) {
  const el = document.createElement('label');
  const input = item.input = document.createElement('input');
  input.type = 'checkbox';
  input.onchange = () => {
    const next = { statuses: new Set(shown.statuses), only: new Set(shown.only) };
    if (input.checked) next[field].add(item); else next[field].delete(item);
    setFilters(null, next.statuses, next.only);
  };
  el.append(input, item.text);
  if (item.title) el.title = item.title;
  return el;
}
$('refine-status').append(...STATUSES.map(s => option(s, 'statuses')));
$('refine-only').append(...ONLY.map(o => option(o, 'only')));
window.onhashchange = () => { shown = readHash(); render(); };
$('refine-clear').onclick = () => setFilters(VIEWS[0]);
$('refine-toggle').onclick = () => {
  const open = $('refine').hidden;
  $('refine').hidden = !open;
  $('refine-toggle').setAttribute('aria-expanded', open);
};

async function run(label, fn) {
  if (busy) return;
  setBusy(true);
  say(label);
  try {
    say(await fn());
  } catch (e) {
    say(e.message, true);
  }
  busy = false;
  await load().catch(e => say(e.message, true));
  setBusy(false);
  // Displaying a picture, or adding some to a playlist, can change what is playing.
  window.playingChanged();
}

function send(picture) {
  run('Sending to the TV…', async () => {
    const r = await api(`/api/library/${picture.id}/send`, { method: 'POST' });
    if (r.warning) throw new Error(r.warning);
    return picture.kind === 'original'
      ? 'Sent to the TV, fitted to the screen. The fitted copy is in the library too.'
      : 'Sent to the TV.';
  });
}

function display(picture) {
  run('Setting artwork…', async () => {
    const r = await api(`/api/library/${picture.id}/display`, { method: 'POST' });
    return r.shown ? 'Now on display.' : 'Selected. Art Mode is off, so it was not put on screen.';
  });
}

function removeFromTV(picture) {
  if (!confirm(`Remove ${picture.name} from the TV? It stays in the library.`)) return;
  run('Removing from the TV…', async () => {
    await api(`/api/library/${picture.id}/remove-from-tv`, { method: 'POST' });
    return 'Removed from the TV.';
  });
}

function setTag(picture, tagged) {
  run('', async () => {
    await api(`/api/library/${picture.id}/tags/building-block`, { method: tagged ? 'PUT' : 'DELETE' });
    return '';
  });
}

function remove(picture) {
  const question = picture.used_in
    ? `Delete ${picture.name} from the library? ${plural(picture.used_in, 'picture')} made from it will stay, but can no longer be edited again.`
    : `Delete ${picture.name} from the library? This cannot be undone.`;
  if (!confirm(question)) return;
  run('Deleting…', async () => {
    await api(`/api/library/${picture.id}`, { method: 'DELETE' });
    return 'Deleted.';
  });
}

// Building blocks can be chosen too, to be edited. A playlist leaves them out and says so.
function choose(picture) {
  if (busy) return;
  say('');
  if (!chosen.delete(picture.id)) chosen.add(picture.id);
  render();
}

// Offer the playlists there are, and a new one. `wanted` is the one to start on.
async function offerPlaylists(wanted) {
  const { items } = await api('/api/playlists');
  $('to').replaceChildren(...items.map(p => new Option(p.name, p.id)), new Option('A new playlist…', 'new'));
  if (items.some(p => String(p.id) === String(wanted))) $('to').value = wanted;
}

async function setChoosing(value, wanted) {
  if (value) {
    try {
      await offerPlaylists(wanted);
    } catch (e) {
      say(e.message, true);
      return;
    }
  }
  choosing = value;
  chosen.clear();
  $('choosing').hidden = !value;
  $('choose').hidden = value;
  render();
}

function addChosen() {
  const to = $('to').selectedOptions[0];
  const pictures = data.items.filter(p => chosen.has(p.id));
  if (!pictures.length) {
    say('Tap the pictures to add first.', true);
    return;
  }
  let name = to.textContent;
  if (to.value === 'new') {
    name = (prompt('Name the new playlist') || '').trim();
    if (!name) return;
  }
  run('Adding to the playlist…', async () => {
    const ids = pictures.map(p => p.id);
    const post = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const r = to.value === 'new'
      ? await api('/api/playlists', post({ name, pictures: ids }))
      : await api(`/api/playlists/${to.value}/pictures`, post({ pictures: ids }));
    chosen.clear();
    await offerPlaylists(r.playlist.id).catch(() => {});
    const fitted = pictures.filter(p => p.kind === 'original').length;
    let text = `Added ${plural(r.added, 'picture')} to ${name}.`;
    if (r.added < pictures.length - r.refused.length) text += ' The rest were in it already.';
    // Tagged as a building block since this page loaded.
    if (r.refused.length) text += ` Left out as building blocks: ${r.refused.join(', ')}.`;
    if (fitted) text += ` ${plural(fitted, 'original')} went in fitted to the screen, and the fitted ${fitted === 1 ? 'copy is' : 'copies are'} in the library too.`;
    return text;
  });
}

$('choose').onclick = () => setChoosing(true);
$('choose-done').onclick = () => setChoosing(false);
$('add-chosen').onclick = addChosen;
// Open the chosen pictures in the editor, one after another, in the order they were chosen.
$('edit-chosen').onclick = () => {
  if (!chosen.size) {
    say('Tap the pictures to edit first.', true);
    return;
  }
  location.href = `/editor?ids=${[...chosen].slice(0, 100).join(',')}`;
};

// Spaces and accented characters are encoded the way the address bar would, so the server can ask for them.
function encodedLink(url) {
  try { return new URL(url).href; } catch { return url; }
}

// Something to add: a name for the messages, and the request that has the server keep it.
const fromFile = file => ({
  name: file.name,
  send() {
    const form = new FormData();
    form.append('file', file);
    return api('/api/editor/upload', { method: 'POST', body: form });
  },
});
const fromLink = url => ({
  name: url,
  send: () => api('/api/editor/fetch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: encodedLink(url) }),
  }),
});

// What is going in now. More dropped in the meantime joins the end of it.
let adding = null;

function add(items) {
  if (adding) { adding.push(...items); return; }
  if (busy) return;
  adding = [...items];
  run('', async () => {
    const before = data.count;
    let added = 0;
    const refused = [];
    for (let i = 0; i < adding.length; i++) {
      const item = adding[i];
      say(`Adding ${item.name} (${i + 1} of ${adding.length})…`);
      try {
        await item.send();
        added++;
      } catch (e) {
        refused.push(`${item.name}: ${e.message}`);
      }
    }
    const total = adding.length;
    adding = null;
    if (refused.length) throw new Error(`Added ${added} of ${total}. Not added: ${refused.join('; ')}`);
    // The same picture a second time is not a second entry, so count what is actually new.
    const fresh = (await api('/api/library')).count - before;
    return `Added ${plural(fresh, 'picture')}.` + (fresh < added ? ` ${added - fresh} already in the library.` : '');
  });
}

function dropped(transfer) {
  const files = [...transfer.files].filter(f => f.type.startsWith('image/'));
  // A link, or a picture dragged out of another browser tab. Several links come one to a line.
  const links = (transfer.getData('text/uri-list') || transfer.getData('text/plain'))
    .split(/\r?\n/).map(line => line.trim()).filter(line => /^https?:\/\//i.test(line));
  if (files.length) add(files.map(fromFile));
  else if (links.length) add([...new Set(links)].map(fromLink));
  else if (!busy) say('Drop picture files or links to them.', true);
}

$('pick').onclick = () => $('files').click();
$('files').onchange = e => { if (e.target.files.length) add([...e.target.files].map(fromFile)); e.target.value = ''; };
$('link-form').onsubmit = e => {
  e.preventDefault();
  if (busy) return;
  add([fromLink($('link').value.trim())]);
  $('link').value = '';
};

// A card's picture dragged onto the box would come back in as a new, small one,
// so a drag that started on this page is left alone.
let ours = false;
addEventListener('dragstart', () => { ours = true; });
addEventListener('dragend', () => { ours = false; });

const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => {
  if (ours) return;
  e.preventDefault();
  drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (!ours) dropped(e.dataTransfer); });

// The library does not need the TV, but only the TV knows what has been removed with
// the remote. Asking for the gallery's list brings the "On TV" labels up to date.
async function start() {
  await load().catch(e => say(e.message, true));
  // Arriving from a playlist's "Add pictures" goes straight to picking them for it.
  const wanted = new URLSearchParams(location.search).get('playlist');
  if (wanted) await setChoosing(true, wanted);
  try {
    await api('/api/art');
    if (!busy) await load();
  } catch (e) {
    $('state').hidden = false;
  }
}

start();
</script>

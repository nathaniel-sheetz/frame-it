<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame TV Art</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2127; --line: #2e333c; --text: #e8eaed;
    --muted: #9aa1ac; --accent: #d9a441; --danger: #e0645c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.on { color: var(--accent); border-color: var(--accent); }
  .pill.err { color: var(--danger); border-color: var(--danger); }
  .spacer { flex: 1; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .nav-link {
    color: var(--text); text-decoration: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px;
  }
  .nav-link:hover { border-color: var(--muted); }

  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px;
  }
  #drop.over { border-color: var(--accent); background: #1c1a14; }
  .hint { color: var(--muted); }
  #link-form { display: flex; flex: 1 1 320px; gap: 8px; }
  #link {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  #link:focus { outline: none; border-color: var(--accent); }

  #staged {
    display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; padding: 16px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
  }
  #staged[hidden] { display: none; }
  #staged .thumb { flex: 0 1 320px; border-radius: 6px; overflow: hidden; }
  .staged-body { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; }
  .staged-head { display: flex; align-items: center; gap: 12px; }
  #staged-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .choice {
    display: flex; flex-direction: column; gap: 8px; padding: 12px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .choice .go { padding: 10px 12px; text-align: center; font-weight: 600; }
  .choice a.go { color: var(--accent); border-color: var(--accent); }
  .choice a.go:hover { background: #1c1a14; }
  .choice a.go.busy { opacity: .5; cursor: default; }
  .choice label { color: var(--muted); display: flex; align-items: center; gap: 6px; }

  #msg { min-height: 22px; margin-bottom: 12px; color: var(--muted); }
  #msg.err { color: var(--danger); }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card.current { border-color: var(--accent); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .badge {
    position: absolute; top: 8px; left: 8px; background: var(--accent); color: #1a1405;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
  }
  .meta { padding: 8px 12px 0; font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; padding: 10px 12px 12px; }
  .actions button:first-child { flex: 1; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Frame TV Art</h1>
  <span id="state" class="pill">Connecting…</span>
  <span id="count" class="pill" hidden></span>
  <span class="spacer"></span>
  <a class="nav-link" href="/editor">Editor</a>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="drop">
    <button id="pick" class="primary">Choose a picture</button>
    <span class="hint">or drop a picture or a link here (JPEG, PNG, WEBP or BMP, up to 50 MB)</span>
    <form id="link-form">
      <input type="url" id="link" placeholder="Paste a picture link" aria-label="Picture link" required>
      <button>Fetch</button>
    </form>
    <input type="file" id="files" accept="image/jpeg,image/png,image/webp,image/bmp" hidden>
  </div>
  <div id="staged" hidden>
    <div class="thumb"><img id="staged-img" alt="Picture ready to add"></div>
    <div class="staged-body">
      <div class="staged-head">
        <span id="staged-name"></span>
        <button id="cancel">Cancel</button>
      </div>
      <div class="choices">
        <div class="choice">
          <button id="send" class="primary go">Send to TV</button>
          <span class="hint">Fitted automatically and sent as it is.</span>
          <label><input type="checkbox" id="crop" checked> Crop to fill the screen (16:9)</label>
          <label><input type="checkbox" id="show"> Display after sending</label>
        </div>
        <div class="choice">
          <a id="fit" class="nav-link go" href="/editor">Custom fit</a>
          <span class="hint">Choose the crop yourself, keep the whole picture with bars, or pair it with a second one.</span>
        </div>
      </div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const grid = $('grid'), msg = $('msg'), state = $('state'), count = $('count');
let busy = false;
// The one picture waiting for a choice between Send to TV and Custom fit.
let staged = null;

function say(text, isError = false) {
  msg.textContent = text;
  msg.className = isError ? 'err' : '';
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(typeof body.detail === 'string' ? body.detail : `Request failed (${res.status})`);
    error.status = res.status;
    throw error;
  }
  return body;
}

const json = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function setBusy(value) {
  busy = value;
  document.querySelectorAll('button').forEach(b => b.disabled = value || b.classList.contains('is-current'));
  // A link cannot be disabled, so its click is refused below while busy.
  $('fit').classList.toggle('busy', value);
}

async function load() {
  try {
    const data = await api('/api/art');
    state.textContent = data.art_mode ? 'Art Mode on' : 'Art Mode off (TV in use)';
    state.className = 'pill' + (data.art_mode ? ' on' : '');
    count.textContent = `${data.items.length} pictures`;
    count.hidden = false;
    render(data);
  } catch (e) {
    state.textContent = 'TV unreachable';
    state.className = 'pill err';
    say(e.message, true);
  }
}

function render(data) {
  grid.replaceChildren();
  if (!data.items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No pictures on the TV yet.';
    grid.append(empty);
    return;
  }
  for (const item of data.items) {
    const isCurrent = item.id === data.current;
    const card = document.createElement('div');
    card.className = 'card' + (isCurrent ? ' current' : '');

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = item.id;
    img.src = `/api/art/${item.id}/thumbnail`;
    thumb.append(img);
    if (isCurrent) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = data.art_mode ? 'On display' : 'Selected';
      thumb.append(badge);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${item.id} · ${item.width}×${item.height}`;

    const actions = document.createElement('div');
    actions.className = 'actions';
    const set = document.createElement('button');
    set.textContent = isCurrent ? 'Current' : 'Set as art';
    set.disabled = isCurrent;
    set.classList.toggle('is-current', isCurrent);
    set.onclick = () => select(item.id);
    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Remove';
    del.onclick = () => remove(item.id);
    actions.append(set, del);

    card.append(thumb, meta, actions);
    grid.append(card);
  }
}

async function run(label, fn) {
  if (busy) return;
  setBusy(true);
  say(label);
  try {
    say(await fn());
  } catch (e) {
    say(e.message, true);
  }
  setBusy(false);
  await load();
}

function select(id) {
  run('Setting artwork…', async () => {
    const r = await api(`/api/art/${id}/select`, { method: 'POST' });
    return r.shown ? 'Now on display.' : 'Selected. Art Mode is off, so it was not put on screen.';
  });
}

function remove(id) {
  if (!confirm(`Remove ${id} from the TV? This cannot be undone.`)) return;
  run('Removing…', async () => {
    await api(`/api/art/${id}`, { method: 'DELETE' });
    return 'Removed.';
  });
}

function showStaged(source) {
  staged = source;
  $('staged').hidden = !source;
  if (!source) {
    $('staged-img').removeAttribute('src');
    return;
  }
  $('staged-img').src = source.url;
  $('staged-name').textContent = `${source.original_filename} · ${source.width}×${source.height}`;
  $('fit').href = '/editor?' + new URLSearchParams({ source: source.filename, name: source.original_filename });
}

// Staging only talks to this server, so unlike run() it does not reload the gallery from the TV.
async function stage(label, request, note = '') {
  if (busy) return;
  setBusy(true);
  say(label);
  try {
    showStaged(await request());
    say(note);
  } catch (e) {
    say(e.message, true);
  }
  setBusy(false);
}

function stageFile(file, note) {
  stage(`Uploading ${file.name}…`, () => {
    const form = new FormData();
    form.append('file', file);
    return api('/api/editor/upload', { method: 'POST', body: form });
  }, note);
}

// Spaces and accented characters are encoded the way the address bar would, so the server can ask for them.
function encodedLink(url) {
  try { return new URL(url).href; } catch { return url; }
}

function stageLink(url) {
  stage('Fetching the picture…', async () => {
    const source = await api('/api/editor/fetch', json({ url: encodedLink(url) }));
    $('link').value = '';
    return source;
  });
}

function send() {
  const source = staged;
  run('Sending to the TV…', async () => {
    const r = await api(`/api/editor/source/${source.filename}/send`, json({ crop: $('crop').checked, show: $('show').checked })).catch(e => {
      // Working files are only kept for a day, so a card left open that long has nothing behind it.
      if (e.status !== 404) throw e;
      showStaged(null);
      throw new Error('That picture is no longer here. Please add it again.');
    });
    // It is on the TV now, so the card goes even if the display step did not work.
    showStaged(null);
    if (r.warning) throw new Error(r.warning);
    if (r.shown) return 'Sent. It is on display now.';
    if (r.selected) return 'Sent and selected. Art Mode is off, so it was not put on screen.';
    return 'Sent to the TV.';
  });
}

function dropped(data) {
  const files = [...data.files].filter(f => f.type.startsWith('image/'));
  if (files.length) {
    stageFile(files[0], files.length > 1 ? `One picture at a time: using ${files[0].name}.` : '');
    return;
  }
  // A link, or a picture dragged out of another browser tab.
  const lines = (data.getData('text/uri-list') || data.getData('text/plain')).split(/\r?\n/);
  const url = lines.map(line => line.trim()).find(line => /^https?:\/\//i.test(line));
  if (url) stageLink(url);
  else say('Drop a picture file or a link to one.', true);
}

$('pick').onclick = () => $('files').click();
$('files').onchange = e => { if (e.target.files.length) stageFile(e.target.files[0]); e.target.value = ''; };
$('link-form').onsubmit = e => { e.preventDefault(); stageLink($('link').value.trim()); };
$('send').onclick = send;
$('fit').onclick = e => { if (busy) e.preventDefault(); };
$('cancel').onclick = () => { showStaged(null); say(''); };
$('staged-img').onerror = () => { if (staged) say('Could not display that picture.', true); };
$('refresh').onclick = () => { say(''); load(); };

const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => dropped(e.dataTransfer));

load();
</script>
</body>
</html>
